<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Катталуу</title>
    <link rel="stylesheet" href="./parol.css">
</head>
<body>

    <div class="register-container">
        <h2>Катталуу</h2>
        <form>
            <div class="input-group">
                <input type="text" placeholder="Атыңыз" required>
            </div>
            <div class="input-group">
                <input type="email" placeholder="Электрондук почта" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Сыр сөз (Пароль)" required>
            </div>
            <button type="submit" class="btn">Катталуу</button>
        </form>
        <div class="login-link">
            Аккаунтуңуз барбы? <a href="#">Кирүү</a>
        </div>
    </div>

</body>
</html>
